# .github/workflows/ci.yml
#
# Addresses #1297 (parse gate) and #1341 (test + boot gates).
#
# The repository had no workflows directory at all, so nothing between a pull
# request and the default branch ever checked the code. Unparsable files reached
# `main` as a result, several of them on the server's require path.
#
# Three gates now run on every PR, cheapest first:
#
#   syntax  -- every tracked .js file parses. Dependency-free, a couple of
#              seconds, catches the "bad merge kept both sides" class outright.
#   boot    -- `require('backend/server.js')` resolves and builds an Express
#              app. Catches missing modules, undeclared dependencies and
#              top-level throws, none of which a parser can see.
#   tests   -- the Jest suite. The `backend-tests` job that #1297 deferred; the
#              suites it was waiting on are green as of #1341.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref so repeated pushes to a PR do not queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Deliberately dependency-free: the gate needs only Node's own parser, so
      # it runs before (and independently of) any npm install. A file that does
      # not parse fails here in seconds rather than at deploy time.
      - name: Check every tracked .js file parses
        run: node scripts/check-syntax.js

      # Also dependency-free. A page added without regenerating the sitemap is
      # simply never indexed, which is invisible until someone goes looking for
      # it in a search engine six months later (#1446). Compares the page set,
      # not <lastmod> -- see the note in the generator for why that field is
      # excluded.
      - name: Check the sitemap covers every public page
        run: node scripts/generate-sitemap.js --check

      # Structural accessibility only -- a skip link, one main landmark, one h1
      # per page. Not a substitute for an audit; it is the subset that has a
      # yes/no answer, so a new page cannot ship without the basics (#1447).
      - name: Check every page has a skip link, a main landmark and an h1
        run: node scripts/check-a11y-landmarks.js

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    # No point installing dependencies for a tree that does not parse.
    needs: syntax
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if package.json and the lock have drifted, which is how the
      # undeclared `@socket.io/redis-adapter` dependency stayed invisible.
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Every suite mocks config/db and config/redis, so no service containers
      # are needed. The placeholders in tests/setupEnv.js satisfy the require-
      # time validation in config/db.js and config/envValidator.js.
      - name: Run Jest
        working-directory: backend
        run: npm test -- --ci --maxWorkers=2

  boot:
    name: Server boots
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # A parse gate cannot see a missing module, an undeclared dependency or a
      # `ReferenceError: Cannot access 'app' before initialization`. This does,
      # in about a second, without a database.
      - name: Require server.js
        working-directory: backend
        run: node ../scripts/check-boot.js
