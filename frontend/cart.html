<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- SEO -->

    <meta
        name="description"
        content="Review your shopping cart, update quantities, and proceed securely to checkout."
    >

    <meta
        name="keywords"
        content="shopping cart, ecommerce cart, checkout, online shopping"
    >

    <meta
        name="author"
        content="AnthropicBots E-Commerce"
    >

    <title>
        Cart | AnthropicBots E-Commerce
    </title>

    <!-- Favicon -->

    <link
        rel="icon"
        type="image/png"
        href="assets/images/logo.png"
    >

    <!-- Styles -->

    <link
        rel="stylesheet"
        href="styles/base.css"
    >

    <link
        rel="stylesheet"
        href="styles/layout.css"
    >

    <link
        rel="stylesheet"
        href="styles/components.css"
    >

    <link
        rel="stylesheet"
        href="styles/hero.css"
    >

    <link
        rel="stylesheet"
        href="styles/product-card.css"
    >

    <link
        rel="stylesheet"
        href="styles/style.css"
    >

    <link
        rel="stylesheet"
        href="styles/back-to-top.css"
    >

    <link
        rel="stylesheet"
        href="styles/cart.css"
    >

    <link
        rel="stylesheet"
        href="styles/checkout-stepper.css"
    >


    <!-- Icons -->

    <link
        rel="stylesheet"
        href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css"
    >

</head>

<body>

    <a class="skip-link" href="#main-content">Skip to main content</a>


    <!-- Navbar -->

    <div id="navbar"></div>

   <main id="main-content" tabindex="-1">
        <h1 class="visually-hidden">Cart</h1>

        <!-- Checkout Progress Stepper -->
        <ul
            id="checkout-stepper"
            data-current-step="cart"
        ></ul>

  



    <!-- Cart Header -->

    <section id="cart-header">

        <h2>

            Your Shopping Cart

        </h2>

        <p>

            Review your items before checkout

        </p>

    </section>

    <!-- Cart Section -->

    <section
        id="cart-page"
        class="section-p1"
    >

        <!-- Cart Items -->

        <div class="cart-items-container">

            <!--
                Expiry notice. cart.js has computed the days remaining from
                CART_CONFIG.EXPIRY_DAYS since the feature landed, but had
                nowhere to write it (#1584). Hidden until updateExpiryWarning
                decides otherwise.
            -->
            <div
                id="cart-expiry-warning"
                class="cart-expiry-warning"
                role="status"
                aria-live="polite"
                style="display: none;"
            ></div>

            <div class="cart-items-header">

                <h2>

                    Cart Items

                </h2>

                <div class="cart-items-header__tools">

                    <label class="select-all-label" for="select-all">
                        <input
                            type="checkbox"
                            id="select-all"
                            class="select-all-checkbox"
                        >
                        Select all
                    </label>

                    <span id="cart-item-count" class="cart-item-count">0 items</span>

                </div>

            </div>

            <!--
                Bulk actions. bulkRemove() and bulkSaveForLater() have been in
                cart.js all along with nothing to trigger them, and
                updateBulkActions() opens with `if (bulkActions && selectedCount)`
                so it was a no-op. Revealed by updateBulkActions once at least
                one line is selected.
            -->
            <div
                id="bulk-actions"
                class="bulk-actions"
                role="region"
                aria-label="Actions for selected items"
                style="display: none;"
            >

                <span id="selected-count" class="selected-count">0 items selected</span>

                <div class="bulk-actions__buttons">

                    <button
                        type="button"
                        id="bulk-save-later-btn"
                        class="bulk-action-btn bulk-action-btn--secondary"
                    >
                        <i class="fas fa-bookmark" aria-hidden="true"></i>
                        Save for later
                    </button>

                    <button
                        type="button"
                        id="bulk-remove-btn"
                        class="bulk-action-btn bulk-action-btn--danger"
                    >
                        <i class="fas fa-trash" aria-hidden="true"></i>
                        Remove selected
                    </button>

                </div>

            </div>

            <div id="cart-items"></div>

            <!--
                Saved for later. renderCart() builds this section itself when
                there is something in it, so this is the container it renders
                into rather than markup of its own.
            -->
            <div id="saved-for-later-container"></div>

        </div>

        <!-- Summary -->

        <div class="cart-summary">

            <h2>

                Order Summary

            </h2>

            <div class="summary-row">

                <span>

                    Subtotal

                </span>

                <span id="subtotal">

                    ₹0

                </span>

            </div>

            <div class="summary-row">

                <span>

                    Tax (18%)

                </span>

                <span id="tax">

                    ₹0

                </span>

            </div>

            <div class="summary-row">

                <span>

                    Shipping

                </span>

                <span id="shipping">

                    Free

                </span>

            </div>

            <!--
                Progress toward free delivery. The figures are the server's;
                this only holds them.
            -->
            <p
                class="free-shipping-progress"
                id="free-shipping-progress"
                aria-live="polite"
            ></p>

            <div class="summary-row discount-row">

                <span>

                    Discount

                </span>

                <span id="discount">

                    -₹0

                </span>

            </div>

            <div class="summary-row total">

                <span>

                    Total

                </span>

                <span id="total">

                    ₹0

                </span>

            </div>

            <form
                id="coupon-form"
                class="coupon-form"
                novalidate
            >

                <label for="coupon-code">

                    Coupon

                </label>

                <div class="coupon-controls">

                    <input
                        id="coupon-code"
                        type="text"
                        placeholder="SAVE10 or SAVE20"
                        autocomplete="off"
                    >

                    <button
                        type="submit"
                        id="apply-coupon-btn"
                    >
                        Apply
                    </button>

                </div>

                <p
                    id="coupon-message"
                    class="coupon-message"
                    aria-live="polite"
                ></p>

            </form>

            <button
                id="empty-cart-btn"
                class="empty-cart-btn"
                type="button"
            >
                Empty Cart
            </button>

            <button id="continue-shopping-btn" onclick="window.location.href='shop.html'">
                ← Continue Shopping
            </button>

            <button id="checkout-btn">

                Proceed to Checkout

            </button>

        </div>

    </section>
    </main>


    <!-- Footer -->

    <div id="footer"></div>

    <!-- Core Scripts -->

    <script
        defer
        src="scripts/config.js"
    ></script>

    <script
        defer
        src="scripts/toast.js"
    ></script>

    <script
        defer
        src="scripts/utils.js"
    ></script>

    <script
        defer
        src="scripts/auth.js"
    ></script>

    <script
        defer
        src="scripts/script.js"
    ></script>

    <script
        defer
        src="scripts/back-to-top.js"
    ></script>

    <script
        defer
        src="scripts/components.js"
    ></script>

    <script
        defer
        src="scripts/checkout-stepper.js"
    ></script>

    

    <!-- Cart Scripts -->

    

    <!-- Cart Scripts -->

    <script
        defer
        src="scripts/cart.js"
    ></script>

    <script
        defer
        src="scripts/cart-restore.js"
    ></script>
     <script defer src="scripts/ui.js"></script>

</body>

</html>
