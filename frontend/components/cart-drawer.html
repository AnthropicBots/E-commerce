<aside
    id="cart-drawer"
    class="cart-drawer"
    role="dialog"
    aria-modal="true"
    aria-labelledby="cart-drawer-title"
    aria-hidden="true"
>
    <div class="cart-drawer-panel">
        <header class="cart-drawer-header">
            <h3 id="cart-drawer-title">Your Cart</h3>
            <button
                type="button"
                id="close-cart-drawer"
                class="cart-drawer-close"
                aria-label="Close cart"
            >
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
        </header>

        <div
            id="cart-drawer-live-region"
            class="sr-only"
            aria-live="polite"
            aria-atomic="true"
        ></div>

        <div
            id="cart-drawer-items"
            class="cart-drawer-items"
            role="region"
            aria-label="Cart items list"
        >
            <!-- Cart items are dynamically rendered here. 
                 Ensure item thumbnails use an explicit wrapper or classes 
                 like object-fit: cover to prevent image enlargement issues. -->
        </div>

        <footer class="cart-drawer-footer">
            <div class="cart-drawer-subtotal">
                <span>Subtotal</span>
                <strong id="cart-drawer-total" aria-live="polite" aria-atomic="true">₹0.00</strong>
            </div>

            <a
                href="cart.html"
                class="cart-drawer-view-btn"
            >
                View Full Cart
            </a>

            <a
                href="checkout.html"
                class="cart-drawer-checkout-btn"
            >
                Checkout
            </a>
        </footer>
    </div>
</aside>
