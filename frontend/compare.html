<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Compare products side-by-side with interactive glassmorphic matrix and spec highlights.">
    <title>Compare Products | AnthropicBots E-Commerce</title>


    <link rel="canonical" href="https://e-commerce-git-main-bhuvanshs-projects.vercel.app/compare.html">
    <link rel="icon" type="image/png" href="assets/images/logo.png">

    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/product-card.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/compare.css">
</head>

<body>

    <a class="skip-link" href="#main-content">Skip to main content</a>


    <!-- Navbar -->
    <div id="navbar"></div>

    <main id="main-content" tabindex="-1">
        <h1 class="visually-hidden">Compare Products</h1>



    <!-- Compare Section -->
    <section id="compare-page" class="section-p1">
        <div class="compare-page-header">
            <h2>Product Specification Comparison</h2>
            <p>Compare features, specifications, ratings, and prices side by side.</p>
        </div>

        <!-- Glassmorphic Toolbar -->
        <div class="compare-toolbar">
            <div class="compare-toolbar-group">
                <label for="compare-sort-select"><strong>Sort By:</strong></label>
                <select id="compare-sort-select" class="compare-select">
                    <option value="">Default</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="rating-desc">Highest Rated</option>
                    <option value="name-asc">Name: A-Z</option>
                </select>
            </div>

            <div class="compare-toolbar-group">
                <label class="toggle-diff-label">
                    <input type="checkbox" id="toggle-diff-checkbox">
                    <span>Show Differences Only</span>
                </label>
            </div>

            <div class="compare-toolbar-group">
                <button type="button" id="clear-compare-btn" class="btn" style="padding: 8px 16px; background: #ef4444; color: #fff; border-radius: 8px;">
                    <i class="fas fa-trash-alt"></i> Clear Comparison
                </button>
            </div>
        </div>

        <!-- Glassmorphic Comparison Matrix Container -->
        <div id="compare-container" class="compare-matrix-wrapper">
            <div id="compare-matrix-content">
                <p style="text-align: center; padding: 40px;">Loading comparison matrix...</p>
            </div>
        </div>
    </section>
    </main>


    <!-- Footer -->

    <div id="footer"></div>

    <!-- Core Scripts -->
    <script src="scripts/config.js"></script>
    <script src="scripts/toast.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/components.js"></script>

    <!-- Compare Script -->
    <script src="scripts/compare.js"></script>

</body>

</html>
